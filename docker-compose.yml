services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.4
    ports:
      - '127.0.0.1:5678:5678'
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: 'false'
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set in .env}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 1
      N8N_PAYLOAD_SIZE_MAX: 1
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'false'
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
  mock:
    image: node:24.9.0-alpine
    working_dir: /app
    command: node server.mjs
    environment:
      MOCK_HOST: 0.0.0.0
      MOCK_STATE_FILE: /data/mock-state.json
    ports:
      - '127.0.0.1:4010:4010'
    volumes:
      - ./mocks/server.mjs:/app/server.mjs:ro
      - mock_data:/data
    restart: unless-stopped
volumes:
  n8n_data:
  mock_data:
